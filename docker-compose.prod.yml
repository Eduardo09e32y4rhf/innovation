# ProduÃ§Ã£o (VPS). Todos os segredos vÃªm do arquivo .env ao lado deste compose.
# Primeiro uso:  bash scripts/security/bootstrap-env.sh   (gera segredos fortes sem sobrescrever os existentes)
# Subir:         docker compose -f docker-compose.prod.yml up -d --build
# O compose RECUSA subir se faltar segredo obrigatÃ³rio (sintaxe ${VAR:?}).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innovation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-innovation_db}
    # Sem "ports": o banco sÃ³ Ã© acessÃ­vel pela rede interna do compose.
    # Ajuste fino para VPS pequena (padrao do postgres e 128MB de shared_buffers e work_mem 4MB). Sobrescreva no .env conforme a RAM.
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-256MB}", "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}", "-c", "work_mem=${PG_WORK_MEM:-8MB}", "-c", "max_connections=${PG_MAX_CONNECTIONS:-60}", "-c", "random_page_cost=1.1"]
    mem_limit: ${DB_MEM_LIMIT:-1g}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innovation} -d ${POSTGRES_DB:-innovation_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: ${REDIS_MEM_LIMIT:-384m}
    restart: always

  api:
    image: ghcr.io/eduardo09e32y4rhf/innovation-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      # Heap do V8 abaixo do mem_limit do container (sobra para buffers/PDF); sem isso o Node estima pelo RAM do host e pode estourar o limite.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=640}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-innovation}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-innovation_db}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      MFA_ENFORCE: ${MFA_ENFORCE:-false}
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:?defina KMS_MASTER_KEY no .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?defina ALLOWED_ORIGINS no .env}
      APP_URL: ${APP_URL:-}
      # Dono da plataforma: o ID do usuario DEV e a identidade protegida (e-mail so vale como legado, sem o ID).
      PLATFORM_OWNER_USER_ID: ${PLATFORM_OWNER_USER_ID:-}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-}
      # Cadastro de empresa sem CPF/CNPJ e sem validar digitos: SO para homologacao do robo de teste. Em producao fica false.
      COMPANY_DOCUMENT_OPTIONAL: ${COMPANY_DOCUMENT_OPTIONAL:-false}
      # Senhas provisorias: validade em horas (1 a 168; padrao 24).
      TEMPORARY_PASSWORD_TTL_HOURS: ${TEMPORARY_PASSWORD_TTL_HOURS:-24}
      # CEO em onboarding: use 'off' somente como saida temporaria.
      CEO_ONBOARDING_ENFORCEMENT: ${CEO_ONBOARDING_ENFORCEMENT:-}
      # Antivirus dos documentos de candidatos (em producao, sem ClamAV o envio e bloqueado).
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      RECRUITMENT_RESUMES_PATH: /data/recruitment
      SUPPORT_ATTACHMENTS_PATH: /data/support
      # Pagamentos (opcionais atÃ© receber os tokens; se informados, o webhook correspondente Ã© exigido)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-asaas}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_API_URL: ${ASAAS_API_URL:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_DEFAULT_BILLING_TYPE: ${ASAAS_DEFAULT_BILLING_TYPE:-UNDEFINED}
      # Dados do emitente que saem no PDF da fatura
      INVOICE_ISSUER_NAME: ${INVOICE_ISSUER_NAME:-Innovation RH}
      INVOICE_ISSUER_LEGAL_NAME: ${INVOICE_ISSUER_LEGAL_NAME:-}
      INVOICE_ISSUER_DOCUMENT: ${INVOICE_ISSUER_DOCUMENT:-}
      INVOICE_ISSUER_ADDRESS: ${INVOICE_ISSUER_ADDRESS:-}
      INVOICE_ISSUER_EMAIL: ${INVOICE_ISSUER_EMAIL:-}
      INVOICE_ISSUER_PHONE: ${INVOICE_ISSUER_PHONE:-}
      INVOICE_ISSUER_SITE: ${INVOICE_ISSUER_SITE:-}
      # Ficha de compensação do boleto no PDF: campos que o Asaas não devolve pela API (copie do boleto oficial)
      INVOICE_BOLETO_BENEFICIARY: ${INVOICE_BOLETO_BENEFICIARY:-}
      INVOICE_BOLETO_BENEFICIARY_DOCUMENT: ${INVOICE_BOLETO_BENEFICIARY_DOCUMENT:-}
      INVOICE_BOLETO_AGENCY: ${INVOICE_BOLETO_AGENCY:-}
      INVOICE_BOLETO_WALLET: ${INVOICE_BOLETO_WALLET:-1}
      INVOICE_BOLETO_SPECIES: ${INVOICE_BOLETO_SPECIES:-DM}
      INVOICE_BOLETO_ACCEPT: ${INVOICE_BOLETO_ACCEPT:-N}
      # Nota fiscal (NFS-e) automática pelo Asaas
      ASAAS_NFSE_ENABLED: ${ASAAS_NFSE_ENABLED:-false}
      ASAAS_NFSE_SERVICE_ID: ${ASAAS_NFSE_SERVICE_ID:-}
      ASAAS_NFSE_SERVICE_CODE: ${ASAAS_NFSE_SERVICE_CODE:-}
      ASAAS_NFSE_SERVICE_NAME: ${ASAAS_NFSE_SERVICE_NAME:-}
      ASAAS_NFSE_DESCRIPTION: ${ASAAS_NFSE_DESCRIPTION:-}
      ASAAS_NFSE_OBSERVATIONS: ${ASAAS_NFSE_OBSERVATIONS:-}
      ASAAS_NFSE_RETAIN_ISS: ${ASAAS_NFSE_RETAIN_ISS:-false}
      ASAAS_NFSE_ISS: ${ASAAS_NFSE_ISS:-0}
      ASAAS_NFSE_COFINS: ${ASAAS_NFSE_COFINS:-0}
      ASAAS_NFSE_CSLL: ${ASAAS_NFSE_CSLL:-0}
      ASAAS_NFSE_INSS: ${ASAAS_NFSE_INSS:-0}
      ASAAS_NFSE_IR: ${ASAAS_NFSE_IR:-0}
      ASAAS_NFSE_PIS: ${ASAAS_NFSE_PIS:-0}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      # Monitoramento (opcionais)
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOKI_HOST: ${LOKI_HOST:-}
      # Repassadas ao container (docs/auditoria/02, secao 5.4). Vazio = 'nao definida' no codigo; TRUST_PROXY, BILLING_GRACE_DAYS e FEATURE_* usam o padrao real.
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
      PRIVACY_RSA_PRIVATE_KEY: ${PRIVACY_RSA_PRIVATE_KEY:-}
      TRIAL_DOCUMENT_HASH_SECRET: ${TRIAL_DOCUMENT_HASH_SECRET:-}
      WHATSAPP_SESSION_PATH: ${WHATSAPP_SESSION_PATH:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AI_ENABLED: ${OPENAI_AI_ENABLED:-}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-}
      OPENAI_MODEL_REASONING: ${OPENAI_MODEL_REASONING:-}
      OPENAI_MONTHLY_BUDGET: ${OPENAI_MONTHLY_BUDGET:-}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-15}
      DUNNING_WARN_DAY: ${DUNNING_WARN_DAY:-}
      DUNNING_BLOCK_DAY: ${DUNNING_BLOCK_DAY:-}
      DUNNING_CANCEL_DAY: ${DUNNING_CANCEL_DAY:-}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      PLATFORM_WHATSAPP_SESSION_KEY: ${PLATFORM_WHATSAPP_SESSION_KEY:-}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      MAIL_REQUIRED: ${MAIL_REQUIRED:-}
      MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS: ${MERCADOPAGO_WEBHOOK_TOLERANCE_SECONDS:-}
      FEATURE_AI: ${FEATURE_AI:-false}
      FEATURE_PARTNERS: ${FEATURE_PARTNERS:-false}
      FEATURE_COMMERCIAL_SALES: ${FEATURE_COMMERCIAL_SALES:-false}
      FEATURE_PROPOSALS: ${FEATURE_PROPOSALS:-false}
      FEATURE_MANUAL_CONTRACTS: ${FEATURE_MANUAL_CONTRACTS:-false}
      FEATURE_CEO_ONBOARDING: ${FEATURE_CEO_ONBOARDING:-false}
      FEATURE_COMMUNICATION: ${FEATURE_COMMUNICATION:-false}
      FEATURE_PROMOTIONS: ${FEATURE_PROMOTIONS:-false}
    volumes:
      - api_data:/data
    mem_limit: ${API_MEM_LIMIT:-1g}
    # SÃ³ o proxy reverso do servidor (localhost) fala com a API.
    ports: ["127.0.0.1:3333:3333"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health/live >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: always

  clamav:
    image: clamav/clamav:stable
    # Sem 'ports': so a API (rede interna) usa o scanner. Na 1a subida baixa as definicoes (alguns minutos; ~1-2 GB de RAM).
    # Nao reduza abaixo de ~1.5g: o clamd carrega o banco de assinaturas inteiro e e morto por OOM em loop.
    # Sem ele, em producao a API RECUSA anexos/curriculos (503). Para liberar RAM, veja docs/DEPLOY-VPS.md (secao Desempenho).
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    volumes:
      - clamav_data:/var/lib/clamav
    restart: always

  web:
    image: ghcr.io/eduardo09e32y4rhf/innovation-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ROBO_QA: ${NEXT_PUBLIC_ROBO_QA:-on}
        NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL: ${NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_FEATURE_AI: ${NEXT_PUBLIC_FEATURE_AI:-false}
        NEXT_PUBLIC_FEATURE_PARTNERS: ${NEXT_PUBLIC_FEATURE_PARTNERS:-false}
        NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES: ${NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES:-false}
        NEXT_PUBLIC_FEATURE_PROPOSALS: ${NEXT_PUBLIC_FEATURE_PROPOSALS:-false}
        NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS: ${NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS:-false}
        NEXT_PUBLIC_FEATURE_CEO_ONBOARDING: ${NEXT_PUBLIC_FEATURE_CEO_ONBOARDING:-false}
        NEXT_PUBLIC_FEATURE_COMMUNICATION: ${NEXT_PUBLIC_FEATURE_COMMUNICATION:-false}
        NEXT_PUBLIC_FEATURE_PROMOTIONS: ${NEXT_PUBLIC_FEATURE_PROMOTIONS:-false}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-old-space-size=384}
    mem_limit: ${WEB_MEM_LIMIT:-640m}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  postgres_data:
  redis_data:
  api_data:
  clamav_data:
