services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innovation
      POSTGRES_PASSWORD: innovation
      POSTGRES_DB: innovation_db
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "postgresql://innovation:innovation@db:5432/innovation_db?schema=public"
      JWT_SECRET: "innovation-secret-key-123"
    ports: ["3333:3333"]
    depends_on:
      - db
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "http://vps11515.integrator.host/api"
    ports: ["3000:3000"]
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
