services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: innovation
      POSTGRES_PASSWORD: innovation
      POSTGRES_DB: innovation_db
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "postgresql://innovation:innovation@db:5432/innovation_db?schema=public"
      JWT_SECRET: "innovation-secret-key-123"
      RECRUITMENT_RESUMES_PATH: /data/recruitment
      # Pagamentos: preencha no arquivo .env ao lado deste compose (o compose lê o .env automaticamente).
      APP_URL: "${APP_URL:-}"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-asaas}"
      ASAAS_API_KEY: "${ASAAS_API_KEY:-}"
      ASAAS_API_URL: "${ASAAS_API_URL:-}"
      ASAAS_WEBHOOK_TOKEN: "${ASAAS_WEBHOOK_TOKEN:-}"
      MERCADOPAGO_ACCESS_TOKEN: "${MERCADOPAGO_ACCESS_TOKEN:-}"
      MERCADOPAGO_PUBLIC_KEY: "${MERCADOPAGO_PUBLIC_KEY:-}"
      MERCADOPAGO_WEBHOOK_SECRET: "${MERCADOPAGO_WEBHOOK_SECRET:-}"
    volumes:
      - api_data:/data
    ports: ["3333:3333"]
    depends_on:
      - db
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "https://innovation-209-50-228-146.sslip.io/api"
    ports: ["3000:3000"]
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  api_data:
