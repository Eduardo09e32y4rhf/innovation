# Trecho para o nginx DO HOST (o que fica na frente do docker-compose.prod.yml). Nao e um site completo:
#  1) as diretivas de gzip vao dentro de `http { }` (ou em /etc/nginx/conf.d/gzip.conf);
#  2) o bloco "proxy_cache_path" e o `upstream` tambem ficam no contexto http;
#  3) as `location` vao dentro do `server { }` do seu dominio.
# Depois: sudo nginx -t && sudo systemctl reload nginx

# ---------- contexto http ----------
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript
           application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

# Conexoes persistentes ate os containers (evita um handshake TCP por requisicao).
upstream innovation_web { server 127.0.0.1:3000; keepalive 16; }
upstream innovation_api { server 127.0.0.1:3333; keepalive 16; }

# Cache em disco SO dos estaticos do Next (nunca de /api).
proxy_cache_path /var/cache/nginx/innovation_static levels=1:2 keys_zone=innovation_static:10m max_size=256m inactive=7d use_temp_path=off;

