# REFERENCIA de nginx do host para o Innovation (INF-10). Vai em /etc/nginx/conf.d/innovation.conf (contexto http).
# NAO e o arquivo real da VPS: compare com `sudo nginx -T` antes de aplicar (docs/DEPLOY-VPS.md, secao "nginx do host").
# Troque SEU-DOMINIO (server_name e caminhos do certificado). Depois: sudo nginx -t && sudo systemctl reload nginx
#
# Regras deste arquivo:
#  - Cabecalhos de seguranca (HSTS, CSP, X-Frame-Options...) NAO sao definidos aqui: o Next ja os envia
#    (docs/auditoria/relatorios-de-teste/SEG-headers.md). Repetir aqui duplicaria o cabecalho.
#  - A API NAO tem prefixo /api: o nginx remove o prefixo (rewrite). Ex.: POST /api/finance/webhook/asaas -> /finance/webhook/asaas.
#  - A API confia em TRUST_PROXY=loopback,uniquelocal: o nginx fica no mesmo host (127.0.0.1) e entrega X-Forwarded-For.
#  - Exige as diretivas gzip e upstream abaixo UMA vez: se ja existe conf.d/gzip.conf ou infra/nginx-host-performance.conf
#    aplicado, remova o bloco duplicado (nginx -t acusa "duplicate upstream").

server_tokens off;

# ---------- compressao ----------
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml font/ttf;

# ---------- limites por IP ----------
limit_req_zone $binary_remote_addr zone=innovation_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=innovation_public:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=innovation_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# ---------- containers (somente loopback) ----------
upstream innovation_api {
  server 127.0.0.1:3333;
  keepalive 16;
}
upstream innovation_web {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name SEU-DOMINIO;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;   # exige nginx >= 1.25.1; em versao antiga troque por "listen 443 ssl http2;"
  server_name SEU-DOMINIO;

  ssl_certificate /etc/letsencrypt/live/SEU-DOMINIO/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SEU-DOMINIO/privkey.pem;

  # TLS (perfil "intermediate" do Mozilla; conferir em https://ssl-config.mozilla.org)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:innovation_ssl:10m;
  ssl_session_tickets off;
  # OCSP stapling: habilite so se o certificado tiver OCSP (Let's Encrypt encerrou o OCSP em 2025; confira o seu).
  # ssl_stapling on;
  # ssl_stapling_verify on;
  # resolver 1.1.1.1 9.9.9.9 valid=300s;

  # Corpo e timeouts (a API aceita ate 14 MiB; 20m deixa folga para multipart).
  client_max_body_size 20m;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  keepalive_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Nunca saem para a internet: metricas (Prometheus fala direto com 127.0.0.1:3333) e o /health completo.
  location ^~ /api/metrics {
    return 404;
  }
  location = /api/health {
    return 404;
  }
  # Sondas usadas pelo deploy.yml (/ready) e por monitores externos (/live).
  location = /api/health/live {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://innovation_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /api/health/ready {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://innovation_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Webhooks de pagamento: SEM limit_req (rajadas legitimas do provedor); a API valida token/assinatura.
  location ^~ /api/finance/webhook/ {
    client_max_body_size 1m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://innovation_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Login, MFA, refresh, senha: 10 requisicoes/minuto por IP (+ rajada de 10).
  location ^~ /api/auth/ {
    limit_req zone=innovation_auth burst=10 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://innovation_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rotas publicas (carreiras, candidatura, visitas).
  location ^~ /api/public/ {
    limit_req zone=innovation_public burst=40 nodelay;
    limit_conn innovation_conn 30;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://innovation_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://innovation_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Estaticos do Next: nome com hash, entao imutaveis. Unico add_header deste arquivo.
  location /_next/static/ {
    proxy_pass http://innovation_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://innovation_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
