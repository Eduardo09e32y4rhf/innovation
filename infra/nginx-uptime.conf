# Nginx do HOST para status.innovationia.com.br -> Uptime Kuma (127.0.0.1:3001).
# Instalar: sudo cp infra/nginx-uptime.conf /etc/nginx/conf.d/uptime.conf
# Certificado: sudo certbot --nginx -d status.innovationia.com.br
# Basic auth opcional (camada extra na frente do login do Kuma):
#   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.htpasswd-uptime admin
#   depois descomente as duas linhas auth_basic abaixo.
server {
    listen 80;
    server_name status.innovationia.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name status.innovationia.com.br;

    ssl_certificate     /etc/letsencrypt/live/status.innovationia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.innovationia.com.br/privkey.pem;

    # auth_basic           "Status";
    # auth_basic_user_file /etc/nginx/.htpasswd-uptime;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (o painel do Kuma depende disso)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
