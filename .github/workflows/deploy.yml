name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA da main a publicar (vazio = main atual)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  images:
    name: Imagens de produção (fora da VPS)
    needs: [ci-manual]
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.ci-manual.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Validar versão da main
        id: ref
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Construir imagens
        env:
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          NEXT_PUBLIC_ROBO_QA: ${{ vars.NEXT_PUBLIC_ROBO_QA || 'on' }}
          NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL: ${{ vars.NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL || 'false' }}
        run: |
          docker build -f apps/api/Dockerfile -t "innovation-api:$RELEASE_SHA" .
          docker build -f apps/web/Dockerfile -t "innovation-web:$RELEASE_SHA" --build-arg NEXT_PUBLIC_ROBO_QA --build-arg NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL .
          docker run --rm --entrypoint node "innovation-api:$RELEASE_SHA" -e 'require("./apps/api/dist/config/env.validation"); require("./apps/api/node_modules/@prisma/client");'
          mkdir -p release
          docker save "innovation-api:$RELEASE_SHA" "innovation-web:$RELEASE_SHA" | gzip -1 > release/images.tar.gz
          (cd release && sha256sum images.tar.gz > images.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: production-images
          path: release/
          compression-level: 0
          retention-days: 3

  staging:
    name: Staging
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-images
          path: release
      - name: Conferir configuração do ambiente
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SITE_URL: ${{ vars.STAGING_URL }}
        run: |
          for key in SSH_HOST SSH_USER SSH_KEY SITE_URL; do
            [ -n "${!key}" ] || { echo "Configuração ausente em staging: $key"; exit 1; }
          done
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: release/images.tar.gz,release/images.tar.gz.sha256
          target: ${{ vars.STAGING_DIR || '/var/www/innovation-staging' }}/.deploy
          strip_components: 1
          timeout: 60s
          command_timeout: 20m
      - uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
          RELEASE_DIR: ${{ vars.STAGING_DIR || '/var/www/innovation-staging' }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: RELEASE_SHA,RELEASE_DIR
          command_timeout: 20m
          script: |
            set -eu
            cd "$RELEASE_DIR"
            git fetch origin main
            git checkout --detach "$RELEASE_SHA"
            bash scripts/deploy/vps-update.sh "$RELEASE_SHA" --prebuilt
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.STAGING_URL }}
        run: curl -fsS --connect-timeout 5 --max-time 15 --retry 5 --retry-delay 4 "$SITE_URL/api/health/ready"

  production:
    name: Producao
    needs: [images, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-images
          path: release
      - name: Conferir configuração do ambiente
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_USER: ${{ secrets.PROD_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SITE_URL: ${{ vars.PROD_URL }}
        run: |
          for key in SSH_HOST SSH_USER SSH_KEY SITE_URL; do
            [ -n "${!key}" ] || { echo "Configuração ausente em production: $key"; exit 1; }
          done
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: release/images.tar.gz,release/images.tar.gz.sha256
          target: ${{ vars.PROD_DIR || '/var/www/innovation' }}/.deploy
          strip_components: 1
          timeout: 60s
          command_timeout: 20m
      - uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
          RELEASE_DIR: ${{ vars.PROD_DIR || '/var/www/innovation' }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: RELEASE_SHA,RELEASE_DIR
          command_timeout: 20m
          script: |
            set -eu
            cd "$RELEASE_DIR"
            git fetch origin main
            git checkout --detach "$RELEASE_SHA"
            bash scripts/deploy/vps-update.sh "$RELEASE_SHA" --prebuilt
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.PROD_URL }}
        run: curl -fsS --connect-timeout 5 --max-time 15 --retry 5 --retry-delay 4 "$SITE_URL/api/health/ready"
