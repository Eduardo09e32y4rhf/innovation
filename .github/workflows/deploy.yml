name: Deploy

# CI verde na main -> staging (automatico) -> producao (1 clique: aprovacao do environment "production")
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/SHA a publicar em producao (vazio = main atual)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No fluxo automatico, o CI ja terminou antes deste workflow iniciar. No
  # disparo manual, validamos o ref novamente antes de acessar a VPS.
  ci-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  staging:
    name: Staging
    needs: [ci-manual]
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.ci-manual.result == 'success'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: cd ${{ vars.STAGING_DIR || '/var/www/innovation-staging' }} && bash scripts/deploy/vps-update.sh ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || github.sha }}
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 "${{ vars.STAGING_URL }}/api/health"

  production:
    name: Producao
    needs: [staging]
    runs-on: ubuntu-latest
    environment: production # configure "Required reviewers" neste environment: e o clique de aprovacao
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: cd ${{ vars.PROD_DIR || '/var/www/innovation' }} && bash scripts/deploy/vps-update.sh ${{ github.event.workflow_run.head_sha || github.event.inputs.ref || github.sha }}
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-delay 6 "${{ vars.PROD_URL }}/api/health"
