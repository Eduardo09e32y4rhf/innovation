name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA da main a publicar (vazio = main atual)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-manual:
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  images:
    permissions:
      contents: read
    name: Imagens de produção (fora da VPS)
    needs: [ci-manual]
    if: >-
      always() &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.ci-manual.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Validar versão da main
        id: ref
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Construir imagens
        env:
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          NEXT_PUBLIC_ROBO_QA: ${{ vars.NEXT_PUBLIC_ROBO_QA || 'on' }}
          NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL: ${{ vars.NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL || 'false' }}
          # Gravadas no bundle do site em tempo de build (Variaveis do repositorio); ausentes = padrao do Dockerfile.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_FEATURE_AI: ${{ vars.NEXT_PUBLIC_FEATURE_AI || 'false' }}
          NEXT_PUBLIC_FEATURE_PARTNERS: ${{ vars.NEXT_PUBLIC_FEATURE_PARTNERS || 'false' }}
          NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES: ${{ vars.NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES || 'false' }}
          NEXT_PUBLIC_FEATURE_PROPOSALS: ${{ vars.NEXT_PUBLIC_FEATURE_PROPOSALS || 'false' }}
          NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS: ${{ vars.NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS || 'false' }}
          NEXT_PUBLIC_FEATURE_CEO_ONBOARDING: ${{ vars.NEXT_PUBLIC_FEATURE_CEO_ONBOARDING || 'false' }}
          NEXT_PUBLIC_FEATURE_COMMUNICATION: ${{ vars.NEXT_PUBLIC_FEATURE_COMMUNICATION || 'false' }}
          NEXT_PUBLIC_FEATURE_PROMOTIONS: ${{ vars.NEXT_PUBLIC_FEATURE_PROMOTIONS || 'false' }}
        run: |
          WEB_ARGS=""
          for name in NEXT_PUBLIC_ROBO_QA NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL NEXT_PUBLIC_TURNSTILE_SITE_KEY NEXT_PUBLIC_FEATURE_AI NEXT_PUBLIC_FEATURE_PARTNERS NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES NEXT_PUBLIC_FEATURE_PROPOSALS NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS NEXT_PUBLIC_FEATURE_CEO_ONBOARDING NEXT_PUBLIC_FEATURE_COMMUNICATION NEXT_PUBLIC_FEATURE_PROMOTIONS; do WEB_ARGS="$WEB_ARGS --build-arg $name"; done
          docker build -f apps/api/Dockerfile -t "innovation-api:$RELEASE_SHA" .
          docker build -f apps/web/Dockerfile -t "innovation-web:$RELEASE_SHA" $WEB_ARGS .
          docker run --rm --entrypoint node "innovation-api:$RELEASE_SHA" -e 'require("./apps/api/dist/config/env.validation"); require("./apps/api/node_modules/@prisma/client");'
          mkdir -p release
          docker save "innovation-api:$RELEASE_SHA" "innovation-web:$RELEASE_SHA" | gzip -1 > release/images.tar.gz
          (cd release && sha256sum images.tar.gz > images.tar.gz.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-images
          path: release/
          compression-level: 0
          retention-days: 3

  staging:
    permissions:
      contents: read
    name: Staging
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-images
          path: release
      - name: Conferir configuração do ambiente
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SITE_URL: ${{ vars.STAGING_URL }}
        run: |
          for key in SSH_HOST SSH_USER SSH_KEY SITE_URL; do
            [ -n "${!key}" ] || { echo "Configuração ausente em staging: $key"; exit 1; }
          done
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: release/images.tar.gz,release/images.tar.gz.sha256
          target: ${{ vars.STAGING_DIR || '/var/www/innovation-staging' }}/.deploy
          strip_components: 1
          timeout: 60s
          command_timeout: 20m
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
          RELEASE_DIR: ${{ vars.STAGING_DIR || '/var/www/innovation-staging' }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: RELEASE_SHA,RELEASE_DIR
          command_timeout: 20m
          script: |
            set -eu
            cd "$RELEASE_DIR"
            git fetch origin main
            git checkout --detach "$RELEASE_SHA"
            bash scripts/deploy/vps-update.sh "$RELEASE_SHA" --prebuilt
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.STAGING_URL }}
        run: curl -fsS --connect-timeout 5 --max-time 15 --retry 5 --retry-delay 4 "$SITE_URL/api/health/ready"

  production:
    permissions:
      contents: read
    name: Producao
    needs: [images, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-images
          path: release
      - name: Conferir configuração do ambiente
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_USER: ${{ secrets.PROD_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SITE_URL: ${{ vars.PROD_URL }}
        run: |
          for key in SSH_HOST SSH_USER SSH_KEY SITE_URL; do
            [ -n "${!key}" ] || { echo "Configuração ausente em production: $key"; exit 1; }
          done
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: release/images.tar.gz,release/images.tar.gz.sha256
          target: ${{ vars.PROD_DIR || '/var/www/innovation' }}/.deploy
          strip_components: 1
          timeout: 60s
          command_timeout: 20m
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
          RELEASE_DIR: ${{ vars.PROD_DIR || '/var/www/innovation' }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: RELEASE_SHA,RELEASE_DIR
          command_timeout: 20m
          script: |
            set -eu
            cd "$RELEASE_DIR"
            git fetch origin main
            git checkout --detach "$RELEASE_SHA"
            bash scripts/deploy/vps-update.sh "$RELEASE_SHA" --prebuilt
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.PROD_URL }}
        run: curl -fsS --connect-timeout 5 --max-time 15 --retry 5 --retry-delay 4 "$SITE_URL/api/health/ready"
