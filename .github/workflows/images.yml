name: Imagens Docker

# Constroi as imagens da API e do Web no GitHub e publica no GHCR.
# A VPS so faz "docker compose pull" (sem build local, que derrubava a maquina por falta de memoria).
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/innovation-${{ matrix.app }}"
          BR="${GITHUB_REF_NAME//\//-}"
          echo "list=$IMG:${GITHUB_SHA},$IMG:$BR" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # NEXT_PUBLIC_* sao gravadas no bundle do site em tempo de build: vem de Variaveis do repositorio
          # (Settings > Secrets and variables > Actions > Variables). Ausentes = mesmos padroes do Dockerfile.
          build-args: |
            NEXT_PUBLIC_ROBO_QA=${{ vars.NEXT_PUBLIC_ROBO_QA || 'on' }}
            NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL=${{ vars.NEXT_PUBLIC_COMPANY_DOCUMENT_OPTIONAL || 'false' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FEATURE_AI=${{ vars.NEXT_PUBLIC_FEATURE_AI || 'false' }}
            NEXT_PUBLIC_FEATURE_PARTNERS=${{ vars.NEXT_PUBLIC_FEATURE_PARTNERS || 'false' }}
            NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES=${{ vars.NEXT_PUBLIC_FEATURE_COMMERCIAL_SALES || 'false' }}
            NEXT_PUBLIC_FEATURE_PROPOSALS=${{ vars.NEXT_PUBLIC_FEATURE_PROPOSALS || 'false' }}
            NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS=${{ vars.NEXT_PUBLIC_FEATURE_MANUAL_CONTRACTS || 'false' }}
            NEXT_PUBLIC_FEATURE_CEO_ONBOARDING=${{ vars.NEXT_PUBLIC_FEATURE_CEO_ONBOARDING || 'false' }}
            NEXT_PUBLIC_FEATURE_COMMUNICATION=${{ vars.NEXT_PUBLIC_FEATURE_COMMUNICATION || 'false' }}
            NEXT_PUBLIC_FEATURE_PROMOTIONS=${{ vars.NEXT_PUBLIC_FEATURE_PROMOTIONS || 'false' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
