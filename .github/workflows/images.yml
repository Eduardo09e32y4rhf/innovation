name: Imagens Docker

# Constroi as imagens da API e do Web no GitHub e publica no GHCR.
# A VPS so faz "docker compose pull" (sem build local, que derrubava a maquina por falta de memoria).
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/innovation-${{ matrix.app }}"
          BR="${GITHUB_REF_NAME//\//-}"
          echo "list=$IMG:${GITHUB_SHA},$IMG:$BR" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
