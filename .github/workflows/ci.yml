name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Lint, tipos e Prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run check:workspace
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint:web
      - run: npm run typecheck:api
      - run: npm run typecheck:web

  unit:
    name: Testes unitarios, seguranca e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:coverage # falha abaixo do minimo definido em vitest.config.ts
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/, retention-days: 7 }

  migrations-empty-db:
    name: prisma migrate deploy em banco vazio
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci_empty }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_empty?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run db:deploy
      - name: Schema final deve bater com o schema.prisma (sem drift)
        run: >
          npm --prefix apps/api exec --
          prisma migrate diff --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma --exit-code

  integration:
    name: Testes de integracao
    needs: [migrations-empty-db]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:deploy
      - run: npm run test:integration

  build:
    name: Build API e Web
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build:api
      - run: npm run build:web

  # Job unico a exigir na protecao de branch da main.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [validate, unit, migrations-empty-db, integration, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if echo '${{ toJSON(needs.*.result) }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
          echo "CI verde"
