name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Validação do schema e geração do client não abrem conexão. Jobs de banco sobrescrevem esta URL.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_validation?schema=public

jobs:
  validate:
    name: Lint, tipos e Prisma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run check:workspace
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run lint:web
      - run: npm run typecheck:api
      - run: npm run typecheck:web

  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.21.2'
      # SHA-256 do gitleaks_8.21.2_linux_x64.tar.gz (conferido com gitleaks_8.21.2_checksums.txt da release oficial)
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0 } # histórico inteiro
      - name: Instalar gitleaks (versao fixa, checksum verificado)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      # Varre TODOS os commits de todas as refs (nao so o PR). Falha em qualquer segredo novo;
      # so passam os espacos reservados e os commits antigos listados em .gitleaks.toml.
      - name: Varrer o historico completo
        run: ./gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --verbose --no-banner

  unit:
    name: Testes unitarios, seguranca e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:coverage # falha abaixo do minimo definido em vitest.config.ts
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/, retention-days: 7 }

  migrations-empty-db:
    name: prisma migrate deploy em banco vazio
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci_empty }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_empty?schema=public
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run db:deploy
      - name: Schema final deve bater com o schema.prisma (sem drift)
        run: >
          npm --prefix apps/api exec --
          prisma migrate diff --from-url "$DATABASE_URL"
          --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code

  integration:
    name: Testes de integracao
    needs: [migrations-empty-db]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:deploy
      - run: npm run test:integration

  build:
    name: Build API e Web
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build:api
      - run: npm run build:web
      - name: Validar imagens que serão instaladas na VPS
        run: |
          docker build -f apps/api/Dockerfile -t innovation-api:ci .
          docker build -f apps/web/Dockerfile -t innovation-web:ci .
          docker run --rm --entrypoint node innovation-api:ci -e 'require("./apps/api/dist/app.module"); require("./apps/api/node_modules/@prisma/client");'
          trap 'docker logs web-smoke; docker rm -f web-smoke' EXIT
          docker run -d --name web-smoke -p 3000:3000 innovation-web:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:3000/login >/dev/null

  browser-e2e:
    name: Browser E2E
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # Job unico a exigir na protecao de branch da main.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [validate, secrets-scan, unit, migrations-empty-db, integration, build, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          node -e 'const results = JSON.parse(process.env.JOB_RESULTS); if (!results.length || results.some(result => result !== "success")) process.exit(1);'
          echo "CI verde"
        env:
          JOB_RESULTS: ${{ toJSON(needs.*.result) }}
