name: Innovation RH Connect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  workspace:
    name: Workspace Foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate workspace foundation
        run: npm run check:workspace
      - name: Upload workspace log
        if: always()
        run: |
          mkdir -p artifacts
          npm run check:workspace > artifacts/workspace-check.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-check
          path: artifacts/workspace-check.log

  prisma:
    name: Prisma Validate & Deploy
    runs-on: ubuntu-latest
    needs: workspace
    env:
      DATABASE_URL: postgresql://innovation_rh_user:test_password@localhost:5432/innovation_rh_connect_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: innovation_rh_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: innovation_rh_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma validate
        run: npm run prisma:validate
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma db push
        run: |
          mkdir -p artifacts
          npm --prefix apps/api exec -- prisma db push --schema apps/api/prisma/schema.prisma --skip-generate 2>&1 | tee artifacts/prisma-migration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prisma-migration
          path: artifacts/prisma-migration.log

  lint:
    name: Lint Web
    runs-on: ubuntu-latest
    needs: prisma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:web

  typecheck-api:
    name: Typecheck API
    runs-on: ubuntu-latest
    needs: prisma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck:api

  typecheck-web:
    name: Typecheck Web
    runs-on: ubuntu-latest
    needs: prisma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck:web

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck-api, typecheck-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run unit coverage
        run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:integration

  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:contract

  security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:security

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [integration, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:web

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: [integration, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:api

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests-e2e/package-lock.json
      - run: npm ci
      - run: npm --prefix tests-e2e ci
      - run: npm --prefix tests-e2e exec -- playwright install --with-deps chromium
      - name: Run smoke E2E
        run: npm --prefix tests-e2e test
      - name: Run legacy E2E
        run: npm --prefix tests-e2e run test:legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests-e2e/playwright-report
            tests-e2e/screenshots
