version: '3.8'

services:
  innovation-postgres-test:
    image: postgres:16-alpine
    container_name: innovation-postgres-test
    environment:
      POSTGRES_USER: innovation_test
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_DB: innovation_test_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovation_test -d innovation_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  innovation-redis-test:
    image: redis:7-alpine
    container_name: innovation-redis-test
    command: redis-server --requirepass test_redis_secret
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test_redis_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
