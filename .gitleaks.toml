# Configuração do gitleaks (job `secrets-scan` do CI e uso local: `gitleaks detect --config .gitleaks.toml`).
#
# REGRA: qualquer segredo NOVO falha o CI. Só é perdoado:
#   1) espaço reservado conhecido (arquivos *.example, valores "TROQUE_...", dado de teste em *.spec.ts);
#   2) commit antigo já registrado em docs/production/SEGREDOS-NO-HISTORICO.md (a rotacionar no provedor).
# Não adicione hashes aqui para "fazer o CI passar": um segredo novo deve ser removido e rotacionado.
title = "Innovation RH Connect"

[extend]
useDefault = true

[allowlist]
description = "Espaços reservados conhecidos e commits antigos já registrados"

paths = [
  # arquivos de exemplo versionados de propósito (.env.example, .env.prod.example, ...)
  '''(^|/)\.env(\.[A-Za-z0-9_-]+)*\.example$''',
  # dados de teste (chaves de idempotência, tokens falsos de validação de ambiente)
  '''(^|/)[^/]+\.spec\.ts$''',
]

regexes = [
  # valores de exemplo: "TROQUE_POR_UM_SEGREDO...", "troque-esta-senha"
  '''(?i)troque[_-]''',
  # senha do banco do ambiente LOCAL de desenvolvimento (nunca produção)
  '''innovation_pass''',
  # token de exemplo usado na documentação
  '''tk1234567890abcdef''',
]

